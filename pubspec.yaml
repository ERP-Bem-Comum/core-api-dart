name: core_api_workspace
description: >-
  Raiz do workspace do core-api-dart (ERP Financeiro bem_comum). Não contém código de
  aplicação — resolve dependências e roda o portão sobre todos os bounded contexts.
publish_to: none

environment:
  sdk: ^3.13.0

# Ao criar um bounded context, acrescente `- packages/<bc>` abaixo.
workspace:
  - tool/harness

# Ordem alfabética exigida por `sort_pub_dependencies`.
dev_dependencies:
  build_runner: ^2.16.1
  lints: ^6.1.0
  mockito: ^5.8.1
  test: ^1.25.0
